<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <link rel="stylesheet" href="Api.css">
</head>

<body>
    <script>
        // products will be stored here for later cart actions
        window.products = [];

        function getCart() {
            return JSON.parse(localStorage.getItem('cart') || '[]');
        }

        function saveCart(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCartCount();
        }

        function addToCart(index) {
            const prod = window.products[index];
            if (!prod) return alert('Product not found');
            const cart = getCart();
            const existing = cart.find(i => i.id === prod.id);
            if (existing) existing.quantity++;
            else cart.push({ id: prod.id, title: prod.title, price: prod.price, image: prod.images[0], quantity: 1 });
            saveCart(cart);
        }

        function changeQtyById(id, delta) {
            const cart = getCart();
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity < 1) item.quantity = 1;
            } else if (delta > 0) {
                const prod = window.products.find(p => p.id === id);
                if (prod) cart.push({ id: prod.id, title: prod.title, price: prod.price, image: prod.images[0], quantity: 1 });
            }
            saveCart(cart);
        }

        // session helpers
        function getSessionId() {
            let s = localStorage.getItem('sessionId');
            if (!s) { s = 's_' + Date.now() + '_' + Math.floor(Math.random() * 10000); localStorage.setItem('sessionId', s); }
            return s;
        }

        async function saveSession() {
            const sid = getSessionId();
            const cart = getCart();
            try {
                const res = await fetch('http://localhost:3001/sessions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: sid, cart, updatedAt: Date.now() }) });
                if (res.ok) alert('Session saved to server'); else alert('Failed to save session');
            } catch (e) { alert('Server unavailable — run `npm run start-json-server`.'); }
        }

        function renderCartCount() {
            const countEl = document.getElementById('cart-count');
            if (!countEl) return;
            const cart = getCart();
            const total = cart.reduce((s, i) => s + i.quantity, 0);
            countEl.textContent = total;
        }

        const fetchApi = async () => {
            try {
                const res = await fetch('https://dummyjson.com/products?limit=100');
                const data = await res.json();
                const dataArr = data.products;
                window.products = dataArr; // expose globally for cart actions
                console.log(dataArr);

                // insert a header with search and cart link
                document.body.innerHTML += `
                    <header style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,0.05);">
                        <div style="display:flex;align-items:center;gap:12px;">
                            <h2 style="margin:0;font-family:inherit;">My Shop</h2>
                            <input id="search" placeholder="Search products..." style="padding:8px;border:1px solid #ddd;border-radius:6px;min-width:220px;">
                            <select id="categoryFilter" style="padding:8px;border:1px solid #ddd;border-radius:6px;">
                                <option value="">All categories</option>
                            </select>
                        </div>
                        <nav style="display:flex;align-items:center;gap:12px;">
                            <button id="sync-server" style="padding:8px 10px">Sync Cart</button>
                            <button id="save-session" style="padding:8px 10px">Save Session</button>
                            <span id="session-id" style="font-size:0.8rem;color:#666"></span>
                            <a href="cart.html" style="text-decoration:none;color:#111;display:inline-flex;align-items:center;gap:8px;">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6h15l-1.5 9h-12z"></path><circle cx="10" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg>
                                <span id="cart-count">0</span>
                            </a>
                        </nav>
                    </header>`;

                // render product cards container
                document.body.innerHTML += '<main id="products" style="display:flex;flex-wrap:wrap;gap:20px;padding:20px;justify-content:center;"></main>';

                const container = document.getElementById('products');

                // populate category filter
                const categories = Array.from(new Set(dataArr.map(p => p.category))).sort();
                const catEl = document.getElementById('categoryFilter');
                categories.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; catEl.appendChild(o); });

                dataArr.forEach(({ id, title, description, images, price, category }, index) => {
                    const card = document.createElement('div');
                    card.className = 'card-hover';
                    card.setAttribute('data-title', title.toLowerCase());
                    card.setAttribute('data-category', category || '');
                    card.style.width = '320px';
                    card.style.padding = '12px';
                    card.innerHTML = `
                        <div class="card-hover__content">
                            <h3 class="card-hover__title">${title}</h3>
                            <p class="card-hover__text">${description}</p>
                            <p style="font-weight:600;margin:8px 0;">$${price}</p>
                            <div style="display:flex;gap:8px;justify-content:center;align-items:center;">
                                <button class="see-btn">SEE MORE</button>
                                <button class="add-btn">ADD TO CART</button>
                                <div class="card-qty" style="display:flex;align-items:center;gap:6px;margin-left:8px;">
                                  <button class="dec">-</button>
                                  <span class="qty">0</span>
                                  <button class="inc">+</button>
                                </div>
                            </div>
                        </div>
                        <div class="card-hover__extra">
                            <h4>Learn <span>now</span> and get <span>40%</span> discount!</h4>
                        </div>
                        <img src="${images[0]}" alt="">`;
                    container.appendChild(card);

                    // wire up buttons for this card
                    const seeBtn = card.querySelector('.see-btn');
                    const addBtn = card.querySelector('.add-btn');
                    const inc = card.querySelector('.inc');
                    const dec = card.querySelector('.dec');
                    const qtySpan = card.querySelector('.qty');

                    function refreshQty() {
                        const cart = getCart();
                        const item = cart.find(x => x.id === id);
                        qtySpan.textContent = item ? item.quantity : 0;
                    }

                    seeBtn.addEventListener('click', () => seemore(index));
                    addBtn.addEventListener('click', () => { addToCart(index); refreshQty(); });
                    inc.addEventListener('click', () => { changeQtyById(id, 1); refreshQty(); });
                    dec.addEventListener('click', () => { changeQtyById(id, -1); refreshQty(); });
                    refreshQty();
                });

                // search and filter handlers
                const searchInput = document.getElementById('search');
                const filterBy = document.getElementById('categoryFilter');
                function applyFilters() {
                    const q = searchInput.value.trim().toLowerCase();
                    const cat = filterBy.value;
                    document.querySelectorAll('.card-hover').forEach(el => {
                        const matchesQ = !q || el.getAttribute('data-title').includes(q);
                        const matchesCat = !cat || el.getAttribute('data-category') === cat;
                        el.style.display = (matchesQ && matchesCat) ? '' : 'none';
                    });
                }
                searchInput.addEventListener('input', applyFilters);
                filterBy.addEventListener('change', applyFilters);

                // sync with json-server when available
                document.getElementById('sync-server').addEventListener('click', async () => {
                    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
                    if (cart.length === 0) return alert('Cart empty');
                    try {
                        const res = await fetch('http://localhost:3001/cart', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: cart, createdAt: Date.now() }) });
                        if (res.ok) alert('Cart synced to server');
                        else alert('Failed to sync');
                    } catch (e) { alert('Server not available. Run `npm run start-json-server`.') }
                });

                // display session id
                document.getElementById('session-id').textContent = getSessionId();

                document.getElementById('save-session').addEventListener('click', () => saveSession());

                renderCartCount();

            } catch (error) {
                console.log(error);
            }
        };

        fetchApi();

        function seemore(index) {
            window.location.href = `fetchApi2.html?productIndex=${index}`;
        }
    </script>
</body>

</html>
